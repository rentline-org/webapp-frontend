<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Rentline | Modern Property Management</title>
    <meta name="title" content="Rentline | Modern Property Management" />
    <meta
      name="description"
      content="Manage properties, tenants, payments, and maintenance in one powerful platform. Built for modern landlords."
    />
    <meta
      name="keywords"
      content="property management, landlord software, tenant management, rent collection, real estate SaaS"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.rentline.io" />

    <!-- Theme -->
    <meta name="theme-color" content="#7c3aed" />

    <!-- Favicons -->
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32x32.png"
    />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

    <!-- Android / PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/android-chrome-512x512.png"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.rentline.io" />
    <meta property="og:title" content="Rentline | Modern Property Management" />
    <meta
      property="og:description"
      content="All-in-one platform for landlords to manage properties, tenants, and operations efficiently."
    />
    <meta
      property="og:image"
      content="https://app.rentline.io/images/dashboard_link_preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://app.rentline.io" />
    <meta
      name="twitter:title"
      content="Rentline | Modern Property Management"
    />
    <meta
      name="twitter:description"
      content="Manage properties, payments, and maintenance in one place."
    />
    <meta
      name="twitter:image"
      content="https://app.rentline.io/images/dashboard_link_preview.png"
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
